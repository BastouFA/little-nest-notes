  .kicker { font: 700 22px/1 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #9c4526; margin-bottom: 30px; }

  .right { background: #9c4526; display: flex; align-items: center; justify-content: center; border-radius: 190px 0 0 190px; margin: 40px 0; }
  .disc { width: 290px; height: 290px; border-radius: 50%; background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; }
  .disc svg { width: 210px; height: 210px; }
  .pills { display: flex; gap: 10px; margin-top: 30px; }
  .pill { font: 600 19px/1 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #e6e0d6; background: #fff; color: #5e5a53; }
