<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon template</title>
<!--
  App/touch icon for Little Nest Notes: the logo mark on a full-bleed square
  (iOS and Android round the corners themselves). ?round=1 gives the rounded,
  transparent-corner version used for favicon.ico.
  Rendered by scripts/brand/make_brand_assets.sh. Not shipped with the site.
-->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  svg { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
<svg id="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" width="64" height="64" fill="#9c4526"/>
  <path d="M32 33.5c-4.6-3.4-8.5-6.3-8.5-10.2 0-2.6 2-4.6 4.5-4.6 1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.5 0 4.5 2 4.5 4.6 0 3.9-3.9 6.8-8.5 10.2z" fill="#f4c7b0"/>
  <path d="M13 36c3 9 10.5 14 19 14s16-5 19-14" fill="none" stroke="#fbf7f3" stroke-width="4" stroke-linecap="round"/>
  <path d="M17 41c5 2 25 2 30 0" fill="none" stroke="#fbf7f3" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
</svg>
<script>
  if (new URLSearchParams(location.search).get("round") === "1") document.getElementById("bg").setAttribute("rx", "16");
</script>
</body>
</html>
