# GitHub Pages: Settings -> Pages -> Source: "GitHub Actions". Every push to main redeploys.
# HTTPS: also tick Settings -> Pages -> "Enforce HTTPS" (redirects http:// to https://).
# GitHub Pages cannot send custom headers (no HSTS / X-Frame-Options), so the build
# embeds the same Content-Security-Policy and Referrer-Policy as <meta> tags instead.
# Optional repo variables (Settings -> Secrets and variables -> Actions -> Variables):
# SITE_URL and PLAUSIBLE_DOMAIN override the values in links.json.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/apply_links.py
        env:
          EMBED_SECURITY_META: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
